name: Android debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The action's default includes the obsolete SDK package "tools".
          packages: 'platform-tools build-tools;35.0.0'
      - name: Install Godot and export templates
        run: |
          set -euxo pipefail
          base=https://github.com/godotengine/godot/releases/download/4.7-stable
          wget -q "$base/Godot_v4.7-stable_linux.x86_64.zip" -O /tmp/godot.zip
          wget -q "$base/Godot_v4.7-stable_export_templates.tpz" -O /tmp/templates.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7-stable_linux.x86_64
          unzip -q /tmp/templates.zip -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.stable"
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.stable/"
      - name: Configure Android export
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.config/godot"
          keytool -genkeypair -keystore "$HOME/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
      - name: Import and export APK
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7-stable_linux.x86_64
          "$GODOT" --headless --editor --path "$GITHUB_WORKSPACE" --import
          mkdir -p export
          "$GODOT" --headless --path "$GITHUB_WORKSPACE" --export-debug Android export/MahjongArena-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify export/MahjongArena-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MahjongArena-debug-apk
          path: export/MahjongArena-debug.apk
          if-no-files-found: error
